<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | ClimateShield</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            ClimateShield
        </a>

        <div>
            <button
                id="alertToggle"
                class="btn btn-light btn-sm"
                onclick="enableAlerts()"
            >
                Enable Email Alerts
            </button>

            <a class="btn btn-outline-light btn-sm" href="/logout">
                Logout
            </a>
        </div>
    </div>
</nav>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="h4 mb-3">
                        Welcome, {{ user_name }}
                    </h2>

                    <p class="text-muted">
                        Logged in as: {{ user_email }}
                    </p>

                    <div class="alert alert-info">
                        Enable email alerts and save a location to receive
                        climate-risk notifications when High or Severe risk
                        is detected.
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Search and Save Location
                        </label>

                        <input
                            type="text"
                            id="place"
                            class="form-control"
                            value=""
                        >
                    </div>

                    <button
                        class="btn btn-success w-100"
                        onclick="searchAndSave()"
                    >
                        Search and Save Location
                    </button>

                    <p id="status" class="mt-3 mb-0 text-muted">
                        Enter a location to save it for climate alerts.
                    </p>
                </div>
            </div>

        </div>
    </div>
</main>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>

<script src="/static/dashboard.js"></script>

</body>
</html>
